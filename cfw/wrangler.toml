name = "watchy"
main = "src/index.ts"
compatibility_date = "2026-06-01"
routes = [
  { pattern = "watchy.rbw.sh", custom_domain = true },
]

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "watchy"
database_id = "0ea16a24-84b7-4ccc-908a-5876a33aef33"

[dev]
port = 4200

[assets]
directory = "../www/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/check", "/test-pushover"]

[vars]
TARGETS_JSON = '{"stars":["runsascoded","ryan-williams","hudcostreets","bikejc","embankmentjc","neighbor-ryan","Open-Athena"],"follows":["runsascoded","ryan-williams","hudcostreets","bikejc","embankmentjc","neighbor-ryan","Open-Athena"]}'
# UTC hour of the daily full sweep (bypasses the count-delta gate)
FULL_SWEEP_HOUR = "8"

[observability]
enabled = true
