name = "watchy"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "watchy"
database_id = "0ea16a24-84b7-4ccc-908a-5876a33aef33"

[dev]
port = 4200

[assets]
directory = "../www/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/check", "/test-pushover"]

[vars]
TARGETS_JSON = '{"stars":["runsascoded","ryan-williams","hudcostreets","bikejc","embankmentjc","neighbor-ryan","Open-Athena","marin-community"],"follows":["runsascoded","ryan-williams","hudcostreets","bikejc","embankmentjc","neighbor-ryan","Open-Athena","marin-community"]}'
# UTC hour of the daily full sweep (bypasses the count-delta gate)
FULL_SWEEP_HOUR = "8"
# Target prefixes whose events get posted to Slack (SLACK_BOT_TOKEN secret + these two must all be set)
SLACK_CHANNEL_ID = "C0BKZUV1SKH"
SLACK_MATCHES_JSON = '["Open-Athena","marin-community"]'
# GH login → OA Slack user id; known actors get an (<@U…>) mention after their GH link
SLACK_USER_MAP_JSON = '{"ryan-williams":"U0922LQRRM0"}'

[observability]
enabled = true
