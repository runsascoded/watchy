name: CI
on:
  push:
    # `main` is the fork point; the work happens on `oa` (internal instance) and `rw`
    # (public reference). Listing only `main` meant CI last ran on a push in August.
    branches: [main, oa, rw]
  pull_request:
jobs:
  py:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
    - run: uv pip install -e '.[dev]'
    - run: uv run pytest test/ -q
  cfw:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfw
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: pnpm install --frozen-lockfile
    - run: pnpm exec tsc --noEmit
    - run: pnpm test
  www:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: pnpm install --frozen-lockfile
    # `build` is `tsc -b && vite build`, so it type-checks too — but it never ran the
    # suite, which is why the FE tests only ever ran on a laptop.
    - run: pnpm build
    - run: pnpm test
